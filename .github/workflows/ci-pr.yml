name: CI (L0)

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Prisma schema uses env("DATABASE_URL"); L0 does not connect to a real DB.
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npx prisma validate

      - run: npx prisma generate

      - run: npm run build

      - run: npm run test:ci
